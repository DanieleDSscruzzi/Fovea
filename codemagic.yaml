workflows:
  fovea-testflight:
    name: Fovea — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45

    integrations:
      app_store_connect: FoveaASC

    environment:
      xcode: 26.4
      vars:
        BUNDLE_ID: "com.byds.fovea"
        TEAM_ID: "S6C4FQLMT5"
        APP_STORE_APP_ID: 6798842299

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:

      - name: Certificato e profilo
        script: |
          set -e
          app-store-connect create-certificate --type IOS_DISTRIBUTION --save \
            || echo "certificato gia presente"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS --type IOS_APP_STORE --create
          keychain initialize
          keychain add-certificates
          echo "=== PROFILI PRESENTI ==="
          ls -1 ~/Library/MobileDevice/Provisioning\ Profiles/ || echo "NESSUNO"

      - name: Archivio firmato a mano
        script: |
          set -e
          PROF=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -1)
          NOME=$(security cms -D -i "$PROF" | plutil -extract Name raw -)
          echo "=== USO IL PROFILO: $NOME ==="

          xcodebuild -project Fovea.xcodeproj \
            -scheme Fovea \
            -configuration Release \
            -archivePath build/Fovea.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$NOME" \
            archive

          cat > export.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$NOME</string></dict>
          </dict></plist>
PLIST
          sed -i '' 's/^          //' export.plist

          xcodebuild -exportArchive \
            -archivePath build/Fovea.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist export.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - superdanipro2020@gmail.com
