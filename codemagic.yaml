workflows:
  fovea-testflight:
    name: Fovea — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45

    integrations:
      app_store_connect: FoveaASC

    environment:
      xcode: 26.4
      ios_signing:
        provisioning_profiles:
          - Fovea
          - FoveaSafari
        certificates:
          - FoveaCert
      vars:
        XCODE_PROJECT: "Fovea.xcodeproj"
        XCODE_SCHEME: "Fovea"
        APP_STORE_APP_ID: 6798842299

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:

      - name: Profili di firma
        script: |
          xcode-project use-profiles

      - name: Numero di build
        script: |
          ULTIMO=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          NUOVO=$(( ${ULTIMO:-0} + 1 ))
          echo "=== BUILD NUMBER: $NUOVO ==="
          python3 -c "
import re,sys
p='Fovea.xcodeproj/project.pbxproj'
t=open(p).read()
t,n=re.subn(r'CURRENT_PROJECT_VERSION = [0-9]+;','CURRENT_PROJECT_VERSION = '+sys.argv[1]+';',t)
open(p,'w').write(t)
print('sostituzioni:', n)
" $NUOVO

      - name: Archivio e ipa
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - superdanipro2020@gmail.com
