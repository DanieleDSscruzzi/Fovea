# codemagic.yaml — Fovea / By D.S.
#
# Va nella RADICE del repository, accanto a Fovea.xcodeproj.
# Codemagic lo legge da solo: nessuna configurazione da fare nella loro
# interfaccia, a parte collegare il repo e caricare la chiave App Store Connect.

workflows:

  fovea-testflight:
    name: Fovea — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45

    # Il nome qui sotto deve combaciare con quello che dai alla chiave
    # App Store Connect in Codemagic › Teams › Integrations.
    integrations:
      app_store_connect: FoveaASC

    environment:
      xcode: latest
      # Firma automatica: Codemagic scarica e applica i profili da solo,
      # a patto che il bundle id sia già registrato su App Store Connect.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.byds.fovea
      vars:
        XCODE_PROJECT: "Fovea.xcodeproj"
        XCODE_SCHEME: "Fovea"
        # Apple ID numerico dell'app, lo trovi nell'URL di App Store Connect
        # quando apri la scheda dell'app. Sostituiscilo.
        APP_STORE_APP_ID: 0000000000

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:

      - name: Profili di firma
        script: |
          xcode-project use-profiles

      # Il numero di build deve superare quello già su TestFlight, altrimenti
      # l'upload viene rifiutato a fine build — dopo aver speso i minuti.
      - name: Numero di build
        script: |
          ULTIMO=$(app-store-connect get-latest-testflight-build-number \
                    "$6798842299" 2>/dev/null || echo 0)
          echo "ultimo su TestFlight: $ULTIMO"
          agvtool new-version -all $(($ULTIMO + 1))

      - name: Archivio e ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      # I log servono davvero: sono la ragione per cui sei qui invece che
      # su Xcode Cloud. Restano scaricabili anche quando la build fallisce.
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Niente gruppi: la build resta in Internal Testing, la distribuisci
        # a mano. Per mandarla subito ai tester, scommenta e metti il gruppo.
        # beta_groups:
        #   - Amici

      email:
        recipients:
          - superdanipro2020@gmail.com
        notify:
          success: true
          failure: true
