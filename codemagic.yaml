workflows:
  fovea-testflight:
    name: Fovea — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45

    integrations:
      app_store_connect: FoveaASC

    environment:
      xcode: 26.4
      ios_signing:
        provisioning_profiles:
          - Fovea
          - FoveaSafari
        certificates:
          - FoveaCert
      vars:
        XCODE_PROJECT: "Fovea.xcodeproj"
        XCODE_SCHEME: "Fovea"
        APP_STORE_APP_ID: 6798842299

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:

      - name: Profili di firma
        script: |
          xcode-project use-profiles

      - name: Numero di build
        script: ./bump.sh

      - name: Metal Toolchain
        script: |
          xcodebuild -downloadComponent MetalToolchain

      - name: Pulizia risorse
        script: |
          xattr -cr FoveaSafari || true
          find FoveaSafari -name "._*" -delete || true
          find . -name ".DS_Store" -delete || true

      - name: Archivio e ipa
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - superdanipro2020@gmail.com
