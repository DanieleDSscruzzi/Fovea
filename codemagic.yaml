workflows:
  fovea-testflight:
    name: Fovea — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45

    integrations:
      app_store_connect: FoveaASC

    environment:
      xcode: 26.4
      ios_signing:
        provisioning_profiles:
          - Fovea
          - FoveaSafari
        certificates:
          - FoveaCert
      vars:
        BUNDLE_ID: "com.byds.fovea"
        TEAM_ID: "S6C4FQLMT5"
        APP_STORE_APP_ID: 6798842299

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:

      - name: Certificato e profilo
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS --type IOS_APP_STORE --create
          keychain add-certificates
          echo "=== PROFILI PRESENTI ==="
          find ~/Library -name "*.mobileprovision" 2>/dev/null || echo "NESSUNO"

      - name: Numero di build
        script: |
          ULTIMO=$(app-store-connect get-latest-testflight-build-number \
                    "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          if [ -z "$ULTIMO" ] || [ "$ULTIMO" = "0" ]; then
            # Se App Store Connect non risponde, uso i minuti trascorsi dal
            # 2026: numerico, sempre crescente, mai un doppione.
            ULTIMO=$(( ($(date +%s) - 1767225600) / 60 ))
          fi
          NUOVO=$(( ULTIMO + 1 ))
          echo "=== BUILD NUMBER: $NUOVO (precedente $ULTIMO) ==="
          agvtool new-version -all $NUOVO

      - name: Archivio
        script: |
          set -e
          PROF=$(find ~/Library -name "*.mobileprovision" 2>/dev/null | head -1)
          NOME=$(security cms -D -i "$PROF" | plutil -extract Name raw -)
          echo "=== USO IL PROFILO: $NOME ==="
          echo "$NOME" > /tmp/nome_profilo
          xcodebuild -project Fovea.xcodeproj -scheme Fovea -configuration Release -archivePath build/Fovea.xcarchive -destination "generic/platform=iOS" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$NOME" archive

      - name: Export ipa
        script: |
          set -e
          NOME=$(cat /tmp/nome_profilo)
          python3 -c "import plistlib,os,sys; plistlib.dump({'method':'app-store-connect','teamID':os.environ['TEAM_ID'],'signingStyle':'manual','provisioningProfiles':{os.environ['BUNDLE_ID']:sys.argv[1]}}, open('export.plist','wb'))" "$NOME"
          xcodebuild -exportArchive -archivePath build/Fovea.xcarchive -exportPath build/ios/ipa -exportOptionsPlist export.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - superdanipro2020@gmail.com
