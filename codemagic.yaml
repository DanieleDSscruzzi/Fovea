workflows:

  fovea-testflight:
    name: Fovea — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45

    integrations:
      app_store_connect: FoveaASC

    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "Fovea.xcodeproj"
        XCODE_SCHEME: "Fovea"
        APP_STORE_APP_ID: 6798842299

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:

      - name: Certificato e profili
        script: |
          app-store-connect fetch-signing-files "com.byds.fovea" \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Numero di build
        script: |
          ULTIMO=$(app-store-connect get-latest-testflight-build-number \
                    "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          echo "ultimo su TestFlight: $ULTIMO"
          agvtool new-version -all $(($ULTIMO + 1))

      - name: Archivio e ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

      email:
        recipients:
          - superdanipro2020@gmail.com
        notify:
          success: true
          failure: true
